<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piero</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #FAF8F3;
            font-family: "New York", "Times New Roman", Georgia, serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 8vh;
        }

        .container {
            text-align: center;
            width: 100%;
        }

        .logo {
            height: 63px;
        }

        p {
            color: #5C5C58;
            font-size: 20px;
            margin-top: 16px;
        }

        .cta {
            display: inline-block;
            margin-top: 48px;
            background: #2596BE;
            color: #FFFFFF;
            font-family: inherit;
            font-size: 16px;
            font-weight: 600;
            padding: 16px 32px;
            border-radius: 3px;
            text-decoration: none;
        }

        .cta:active {
            opacity: 0.85;
        }

        .copyright {
            position: fixed;
            bottom: 16px;
            right: 16px;
            color: #B0AEA8;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="PieroWebLogo.png" alt="Piero" class="logo">
        <p>Your exhibition diary</p>
        <a href="https://testflight.apple.com/join/XXXXXX" class="cta">Try the app</a>
    </div>
    <span class="copyright">&copy; Samuel Spike 2026</span>
</body>
</html>
