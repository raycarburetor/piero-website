<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piero — Your exhibition diary</title>
    <meta name="description" content="The social discovery platform for exhibitions in London.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1 1'><rect width='1' height='1' fill='%23FAF8F3'/></svg>">
    <link rel="canonical" href="https://pieroapp.com/">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://pieroapp.com/">
    <meta property="og:title" content="Piero — Your exhibition diary">
    <meta property="og:description" content="The social discovery platform for exhibitions in London.">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">

    <meta name="twitter:description" content="The social discovery platform for exhibitions in London.">
    <meta name="twitter:image" content="https://pieroapp.com/pierosharecard.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #FAF8F3;
            font-family: "New York", "Times New Roman", Georgia, serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 8vh;
        }

        .container {
            text-align: center;
            width: 100%;
        }

        .logo {
            height: 63px;
        }

        p {
            color: #5C5C58;
            font-size: 20px;
            margin-top: 16px;
        }

        .cta {
            display: inline-block;
            margin-top: 48px;
            background: #2596BE;
            color: #FFFFFF;
            font-family: inherit;
            font-size: 18px;
            font-weight: 600;
            padding: 16px 32px;
            border-radius: 3px;
            text-decoration: none;
        }

        .cta:active {
            opacity: 0.85;
        }

        .copyright {
            position: fixed;
            bottom: 16px;
            right: 16px;
            color: #B0AEA8;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="PieroWebLogo.png" alt="Piero" class="logo">
        <p>Your exhibition diary</p>
        <a href="https://testflight.apple.com/join/5b5uWphR" class="cta">Try the beta</a>
    </div>
    <span class="copyright">&copy; Samuel Spike 2026</span>
